# 07-bad-bots.conf — block bad bots, scrapers and exploit scanners by User-Agent.
#
# WHERE IT GOES:
#   1. Copy this file to /etc/nginx/conf.d/bad-bots.conf
#      (it loads inside the http{} context — the map{} directive only works there)
#   2. Add this line inside each server{} block you want to protect:
#          if ($bad_bot) { return 444; }
#
# WHY 444: it closes the connection without sending any response, which costs
# scrapers a retry while costing you almost nothing (no 403 body, no logs spam).
#
# Legitimate crawlers (Googlebot, Bingbot, etc.) are deliberately NOT listed.
# If you rely on SEO tools that crawl your site (Ahrefs, Semrush), comment
# those lines out before going live.

map $http_user_agent $bad_bot {
    default 0;

    # --- SEO-tool crawlers that ignore rate limits (comment out if you use them)
    ~*AhrefsBot        1;
    ~*SemrushBot       1;
    ~*MJ12bot          1;
    ~*DotBot           1;

    # --- AI / data scrapers that ignore robots.txt
    ~*GPTBot           1;
    ~*ChatGPT-User     1;
    ~*CCBot            1;
    ~*anthropic-ai     1;
    ~*ClaudeBot        1;
    ~*Bytespider       1;
    ~*Diffbot          1;

    # --- Generic scrapers / downloaders
    ~*Scrapy           1;
    ~*HTTrack          1;
    ~*WebCopier        1;
    ~*Teleport         1;
    ~*Offline\ Explorer 1;
    ~*SiteSucker       1;
    ~*curl             1;
    ~*wget             1;
    ~*python-requests  1;
    ~*libwww-perl      1;
    ~*Java/            1;

    # --- Exploit scanners / vulnerability probes
    ~*sqlmap           1;
    ~*nikto            1;
    ~*masscan          1;
    ~*nmap             1;
    ~*zgrab            1;
    ~*dirbuster        1;
    ~*wpscan           1;
    ~*Acunetix         1;
    ~*Nessus           1;

    # --- Fake browsers with no real rendering engine behind them
    ~*PhantomJS        1;
    ~*HeadlessChrome   1;
}

# Usage inside a server block:
#
#   server {
#       listen 443 ssl;
#       server_name example.com;
#
#       if ($bad_bot) { return 444; }
#
#       ...
#   }
