# Nginx FastCGI cache for WordPress (full-page cache, bypasses for logged-in users)
# 1) Place in http { } context (e.g. /etc/nginx/conf.d/fastcgi-cache.conf)
# 2) Add the location / override to your server block.

fastcgi_cache_path /var/cache/nginx/fastcgi levels=1:2 keys_zone=WORDPRESS:100m inactive=60m;
fastcgi_cache_key "$scheme$request_method$host$request_uri";
fastcgi_cache_use_stale error timeout invalid_header http_500;
fastcgi_ignore_headers Cache-Control Expires Set-Cookie;

