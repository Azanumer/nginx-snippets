# Static asset caching + compression for Nginx
# Place inside server { }.

# GZIP (and Brotli if the module is installed)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json
           application/javascript application/rss+xml application/atom+xml
           image/svg+xml font/ttf font/otf;
gzip_min_length 1024;

# Long-term cache for versioned/static assets
location ~* \.(avif|webp|jpg|jpeg|png|gif|svg|css|js|woff2?|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}
