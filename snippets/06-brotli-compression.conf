# ------------------------------------------------------------------------------
# Brotli compression for Nginx (https context — /etc/nginx/nginx.conf)
#
# Brotli compresses text assets ~15-25% smaller than gzip, which is a direct
# win for Core Web Vitals / PageSpeed scores. Requires the ngx_brotli module:
#   Ubuntu/Debian:  sudo apt install libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
#                   then add  load_module modules/ngx_http_brotli_filter_module.so;
#                              load_module modules/ngx_http_brotli_static_module.so;
#                   at the TOP of nginx.conf (before the events block).
# Docker (official nginx image): needs a custom build — see nginx:alpine
#   brotli examples, or skip this and keep gzip only.
# ------------------------------------------------------------------------------

http {
    # ... your existing http block ...

    # -- dynamic Brotli compression (generated on the fly) --
    brotli              on;
    brotli_comp_level   6;                      # 1-11; 6 is the sweet spot (higher = slower, barely smaller)
    brotli_min_length   256;                    # don't bother compressing tiny files
    brotli_window       512k;
    brotli_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/opentype
        application/vnd.ms-fontobject;

    # -- serve pre-compressed .br files when they exist (best performance) --
    # Generate them at deploy time, e.g.:
    #   find /var/www/html -type f \( -name '*.css' -o -name '*.js' \) -exec brotli -k -f -q 11 {} \;
    brotli_static on;

    # -- keep gzip as the fallback for clients without Brotli (old browsers,
    #    some bots). Both can be on at the same time; Nginx negotiates.
    gzip            on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # Never compress already-compressed formats — it wastes CPU and can
    # actually make files bigger: jpg, png, webp, avif, mp4, zip, gz.
}
